name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # create GitHub releases and tags
  issues: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # semantic-release reads every commit and tag since the last
          # release to choose the next version; a shallow clone breaks that.
          fetch-depth: 0

      # semantic-release 25 needs Node ^22.14 or >=24.10. Node 24 also ships
      # npm 11, which npm trusted publishing requires.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # Never publish a build that fails its tests.
      - name: Test
        run: npm test

      # Publishing to npm uses trusted publishing (no stored token) once the
      # package is linked to this workflow on npmjs.com. An NPM_TOKEN secret
      # still works instead, if one is set.
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
